[project]
name = "booking-conversion"
version = "0.2.0"
description = "Прогнозирование завершения бронирования авиабилета"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "dvc>=3.50",
]

[dependency-groups]
dev = ["pytest>=8.0"]
